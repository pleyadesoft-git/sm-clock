name: Build Windows Agent (.exe)

on:
  push:
    branches: [main, develop]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent-windows.yml'
      - 'packages/contracts/**'
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent-windows.yml'
      - 'packages/contracts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release sm-clock-agent.exe (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'agent/pyproject.toml'

      - name: Install build dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Run Pytest suite on Windows
        working-directory: agent
        run: |
          pytest -v

      - name: Compile Executable with PyInstaller
        working-directory: agent
        run: |
          pyinstaller --clean -y agent.spec

      - name: Verify compiled executable
        working-directory: agent
        run: |
          .\dist\sm-clock-agent.exe status
          .\dist\sm-clock-agent.exe --help

      - name: Prepare distribution bundle
        shell: pwsh
        run: |
          $bundleDir = "./release-bundle/sm-clock-agent-windows-x64"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null

          # Intentar incluir NSSM (Non-Sucking Service Manager) en el paquete
          try {
            choco install nssm -y --no-progress
            $nssmCmd = Get-Command nssm -ErrorAction SilentlyContinue
            if ($nssmCmd -and (Test-Path $nssmCmd.Source)) {
              Copy-Item $nssmCmd.Source "$bundleDir/nssm.exe"
            }
          } catch {
            Write-Host "Choco nssm install failed, fallback to schtasks in script"
          }

          Copy-Item ./agent/dist/sm-clock-agent.exe $bundleDir/
          Copy-Item ./agent/scripts/install-service.bat $bundleDir/
          Copy-Item ./agent/scripts/install-service.ps1 $bundleDir/
          Copy-Item ./agent/scripts/uninstall-service.bat $bundleDir/
          Copy-Item ./agent/scripts/iniciar-agente.bat $bundleDir/
          Copy-Item ./agent/scripts/abrir-interfaz.bat $bundleDir/
          if (Test-Path ./agent/src/agent/ui/icon.ico) {
            Copy-Item ./agent/src/agent/ui/icon.ico $bundleDir/
          }

          $readmeText = @"
          ========================================================
            SM-CLOCK AGENTE LOCAL DE ASISTENCIA (TIJUANA, B.C.)
          ========================================================
          El Agente Local captura checadas de relojes ZKTeco y Hikvision
          en la red local del cliente y las sincroniza con el SaaS SM-Clock.

          COMO USAR ESTE PAQUETE:

          --- OPCION A: INSTALACION EN SEGUNDO PLANO (SERVICIO RECOMENDADO) ---
          1. Coloca esta carpeta descomprimida en una ruta permanente
             (ejemplo: C:\SM-Clock-Agent).
          2. Haz clic derecho sobre 'install-service.bat' y selecciona:
             'Ejecutar como Administrador'.
          3. El agente se registrara como servicio de arranque automatico.
          4. Se abrira tu navegador en http://127.0.0.1:8085

          --- OPCION B: EJECUCION MANUAL / MODO PRUEBAS ---
          1. Haz doble clic en 'iniciar-agente.bat' o en 'sm-clock-agent.exe'.
          2. Se abrira una ventana de consola y automaticamente se lanzara
             tu navegador en: http://127.0.0.1:8085

          --- CONFIGURACION EN LA INTERFAZ WEB (http://127.0.0.1:8085) ---
          1. Enrolamiento: En la pestana 'Diagnostico Cloud & APIs', ingresa el
             codigo de un solo uso generado en la plataforma web de Super-Admin.
          2. Relojes: En la pestana 'Relojes y Terminales', captura la IP,
             puerto y marca (ZKTeco / Hikvision), haz clic en 'Probar Conexion'
             y luego en 'Guardar Reloj en SQLite'.
          3. Acceso Tecnico: Puedes iniciar sesion con tus credenciales de
             Super-Admin / Admin del Tenant o con el PIN offline: 123456.

          Para abrir el panel en cualquier momento, haz doble clic en:
             abrir-interfaz.bat
          "@
          Set-Content -Path "$bundleDir/LEEME_INSTALACION.txt" -Value $readmeText -Encoding UTF8

          # Crear archivo ZIP listo para descarga directa
          Compress-Archive -Path "$bundleDir/*" -DestinationPath "./release-bundle/sm-clock-agent-windows-x64.zip" -Force

      - name: Upload Windows Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm-clock-agent-windows-x64
          path: ./release-bundle/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (Latest & Tags)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Agente Local Windows (Última Versión)' }}
          body: |
            ## SM-Clock Agente Local para Windows (x64)
            Agente en segundo plano para captura de checadas de relojes ZKTeco y Hikvision (Tijuana, B.C.).

            ### Enlaces de descarga directa:
            - 📦 [**Descargar Paquete Completo (.zip)**](https://github.com/pleyadesoft-git/sm-clock/releases/latest/download/sm-clock-agent-windows-x64.zip) — Incluye instalador automático como servicio de Windows.
            - ⚡ [**Descargar Ejecutable Directo (sm-clock-agent.exe)**](https://github.com/pleyadesoft-git/sm-clock/releases/latest/download/sm-clock-agent.exe)

            ### Instalación rápida:
            1. Descarga y descomprime `sm-clock-agent-windows-x64.zip`.
            2. Haz clic derecho en `install-service.bat` y selecciona **"Ejecutar como Administrador"**.
            3. Abre en tu navegador [http://127.0.0.1:8085](http://127.0.0.1:8085) e inicia sesión con tus credenciales de Super-Admin o Admin del Tenant.
          files: |
            ./release-bundle/sm-clock-agent-windows-x64.zip
            ./agent/dist/sm-clock-agent.exe
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
