name: Build Local Agent (Windows & macOS)

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
    paths:
      - 'agent/**'
      - 'apps/desktop/**'
      - '.github/workflows/build-agent.yml'
      - 'packages/contracts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Agent (.exe & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'agent/pyproject.toml'

      - name: Install build dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Run Pytest suite on Windows
        working-directory: agent
        run: |
          pytest -v

      - name: Compile Executable with PyInstaller
        working-directory: agent
        run: |
          pyinstaller --clean -y agent.spec

      - name: Verify compiled executable
        working-directory: agent
        run: |
          .\dist\sm-clock-agent.exe status
          .\dist\sm-clock-agent.exe --help

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron Desktop Installer (Windows NSIS)
        env:
          VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://gyqdmjvjmmsoepdnwzoy.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://gyqdmjvjmmsoepdnwzoy.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5cWRtanZqbW1zb2VwZG53em95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1ODk0MDgsImV4cCI6MjExMDE2NTQwOH0.dKSCNtLtRcjHQC4NP7lCE_Pbdam-9CIZLbJbwf2fMFw' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5cWRtanZqbW1zb2VwZG53em95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1ODk0MDgsImV4cCI6MjExMDE2NTQwOH0.dKSCNtLtRcjHQC4NP7lCE_Pbdam-9CIZLbJbwf2fMFw' }}
          NEXT_PUBLIC_AUTH_REDIRECT_URL: ${{ secrets.NEXT_PUBLIC_AUTH_REDIRECT_URL || 'https://sm-clock.pleyadesoft.com/auth/callback' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://sm-clock.pleyadesoft.com' }}
        run: pnpm --filter @sm-clock/desktop package:win

      - name: Prepare distribution bundle
        shell: pwsh
        run: |
          $bundleDir = "./release-bundle/sm-clock-agent-windows-x64"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null

          try {
            choco install nssm -y --no-progress
            $nssmCmd = Get-Command nssm -ErrorAction SilentlyContinue
            if ($nssmCmd -and (Test-Path $nssmCmd.Source)) {
              Copy-Item $nssmCmd.Source "$bundleDir/nssm.exe"
            }
          } catch {
            Write-Host "Choco nssm install failed, fallback to schtasks in script"
          }

          Copy-Item ./agent/dist/sm-clock-agent.exe $bundleDir/
          Copy-Item ./agent/scripts/install-service.bat $bundleDir/
          Copy-Item ./agent/scripts/install-service.ps1 $bundleDir/
          Copy-Item ./agent/scripts/uninstall-service.bat $bundleDir/
          Copy-Item ./agent/scripts/iniciar-agente.bat $bundleDir/
          Copy-Item ./agent/scripts/abrir-interfaz.bat $bundleDir/
          if (Test-Path ./agent/src/agent/ui/icon.ico) {
            Copy-Item ./agent/src/agent/ui/icon.ico $bundleDir/
          }

          $readmeText = @"
          ========================================================
            SM-CLOCK AGENTE LOCAL DE ASISTENCIA (TIJUANA, B.C.)
          ========================================================
          El Agente Local captura checadas de relojes ZKTeco y Hikvision
          en la red local del cliente y las sincroniza con el SaaS SM-Clock.

          COMO USAR ESTE PAQUETE:

          --- OPCION A: APLICACION DE ESCRITORIO CON INTERFAZ (RECOMENDADA) ---
          1. Ejecuta 'SM-Clock-Agente-Setup.exe' para instalar la aplicacion.
          2. Abre el acceso directo 'SM-Clock Agente' desde el escritorio.
          3. Inicia sesion con tus credenciales de Super-Admin o Admin del Tenant.

          --- OPCION B: INSTALACION EN SEGUNDO PLANO (SERVICIO DE WINDOWS) ---
          1. Coloca esta carpeta descomprimida en una ruta permanente
             (ejemplo: C:\SM-Clock-Agent).
          2. Haz clic derecho sobre 'install-service.bat' y selecciona:
             'Ejecutar como Administrador'.
          3. El agente se registrara como servicio de arranque automatico.
          4. Se abrira tu navegador en http://127.0.0.1:8085

          --- OPCION C: EJECUCION MANUAL / MODO PRUEBAS ---
          1. Haz doble clic en 'iniciar-agente.bat' o en 'sm-clock-agent.exe'.
          2. Se abrira una ventana de consola y automaticamente se lanzara
             tu navegador en: http://127.0.0.1:8085

          --- CONFIGURACION EN LA INTERFAZ ---
          1. Enrolamiento: En la pestana 'Diagnostico Cloud & APIs', ingresa el
             codigo de un solo uso generado en la plataforma web de Super-Admin.
          2. Relojes: En la pestana 'Relojes y Terminales', captura la IP,
             puerto y marca (ZKTeco / Hikvision), haz clic en 'Probar Conexion'
             y luego en 'Guardar Reloj en SQLite'.
          3. Acceso Tecnico: Puedes iniciar sesion con tus credenciales de
             Super-Admin / Admin del Tenant o con el PIN offline: 123456.

          Para abrir el panel en cualquier momento, haz doble clic en:
             abrir-interfaz.bat
          "@
          Set-Content -Path "$bundleDir/LEEME_INSTALACION.txt" -Value $readmeText -Encoding UTF8

          Compress-Archive -Path "$bundleDir/*" -DestinationPath "./release-bundle/sm-clock-agent-windows-x64.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            apps/desktop/release/SM-Clock-Agente-Setup.exe
            release-bundle/sm-clock-agent-windows-x64.zip
            agent/dist/sm-clock-agent.exe
          retention-days: 30
          if-no-files-found: error

  build-mac:
    name: Build macOS Agent (.dmg & App)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'agent/pyproject.toml'

      - name: Install build dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Run Pytest suite on macOS
        working-directory: agent
        run: |
          pytest -v

      - name: Compile Executable with PyInstaller
        working-directory: agent
        run: |
          pyinstaller --clean -y agent.spec

      - name: Verify compiled executable
        working-directory: agent
        run: |
          ./dist/sm-clock-agent status
          ./dist/sm-clock-agent --help

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron Desktop Installer (macOS DMG)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://gyqdmjvjmmsoepdnwzoy.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://gyqdmjvjmmsoepdnwzoy.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5cWRtanZqbW1zb2VwZG53em95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1ODk0MDgsImV4cCI6MjExMDE2NTQwOH0.dKSCNtLtRcjHQC4NP7lCE_Pbdam-9CIZLbJbwf2fMFw' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5cWRtanZqbW1zb2VwZG53em95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1ODk0MDgsImV4cCI6MjExMDE2NTQwOH0.dKSCNtLtRcjHQC4NP7lCE_Pbdam-9CIZLbJbwf2fMFw' }}
          NEXT_PUBLIC_AUTH_REDIRECT_URL: ${{ secrets.NEXT_PUBLIC_AUTH_REDIRECT_URL || 'https://sm-clock.pleyadesoft.com/auth/callback' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://sm-clock.pleyadesoft.com' }}
        run: |
          pnpm --filter @sm-clock/desktop package:mac
          ls -la apps/desktop/release/
          if [ ! -f apps/desktop/release/SM-Clock-Agente-mac.dmg ]; then
            first_dmg=$(find apps/desktop/release -name "*.dmg" | head -n 1)
            if [ -n "$first_dmg" ]; then
              cp "$first_dmg" apps/desktop/release/SM-Clock-Agente-mac.dmg
            fi
          fi

      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            apps/desktop/release/SM-Clock-Agente-mac.dmg
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish Unified GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la ./release-files

      - name: Publish GitHub Release (Latest & Tags)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Agente Local Multiplataforma (Última Versión)' }}
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            ## SM-Clock Agente Local Multiplataforma (macOS & Windows)
            Agente para captura de checadas de relojes ZKTeco y Hikvision (Tijuana, B.C.).

            ### Enlaces de descarga directa:
            - 🍏 [**Descargar Instalador de Escritorio para Mac (.dmg)**](https://github.com/pleyadesoft-git/sm-clock/releases/latest/download/SM-Clock-Agente-mac.dmg) — Aplicación nativa para macOS con interfaz visual y motor local.
            - 🖥️ [**Descargar Instalador de Escritorio para Windows (.exe Setup)**](https://github.com/pleyadesoft-git/sm-clock/releases/latest/download/SM-Clock-Agente-Setup.exe) — Aplicación nativa para Windows con instalador guiado.
            - 📦 [**Descargar Paquete Servicio Windows (.zip)**](https://github.com/pleyadesoft-git/sm-clock/releases/latest/download/sm-clock-agent-windows-x64.zip) — Servicio silencioso de Windows sin interfaz gráfica.
            - ⚡ [**Descargar Ejecutable Directo Windows (sm-clock-agent.exe)**](https://github.com/pleyadesoft-git/sm-clock/releases/latest/download/sm-clock-agent.exe)

            ### Instalación de la app de escritorio:
            - **macOS**: Abre el archivo `SM-Clock-Agente-mac.dmg`, arrastra `SM-Clock Agente` a la carpeta Aplicaciones y ábrelo.
            - **Windows**: Ejecuta el instalador `SM-Clock-Agente-Setup.exe` y sigue los pasos del asistente.
          files: |
            ./release-files/SM-Clock-Agente-mac.dmg
            ./release-files/SM-Clock-Agente-Setup.exe
            ./release-files/sm-clock-agent-windows-x64.zip
            ./release-files/sm-clock-agent.exe
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
