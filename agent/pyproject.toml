[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sm-clock-agent"
version = "1.0.0"
description = "Agente Local Python para relojes checadores ZKTeco y Hikvision (Tijuana, B.C.)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "apscheduler>=3.10.4",
  "cryptography>=43.0.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:.*:Warning:starlette.*",
  "ignore:.*:Warning:fastapi.*",
]
